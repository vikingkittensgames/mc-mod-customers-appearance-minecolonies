pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "customers-minecolonies-appearance"

if (file("minecolonies-devtools").isDirectory()) {
    include("minecolonies-devtools")
}
